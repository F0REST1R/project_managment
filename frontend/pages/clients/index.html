<!DOCTYPE html>
<html lang="ru">

<head>

	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Клиенты</title>

	<link rel="stylesheet" href="../../css/dashboard.css">
	<link rel="stylesheet" href="../../css/clients.css">

	<script src="https://unpkg.com/lucide@latest"></script>

</head>

<body>

	<div class="layout">

		<div id="sidebar"></div>

		<div class="main">

			<div id="header"></div>

			<main class="workspace">

				<div class="clients-header">

					<h1>
						Клиенты
					</h1>

					<button class="create-client" id="openClientModal">
						Создать клиента
					</button>

				</div>

                <div class="clients-search-section">
                    <div class="clients-search">
                        <input
                            type="text"
                            placeholder="Поиск клиентов..."
                            class="client-search-input"
                            id="clientSearch"
                        >
                    </div>

                    <div class="clients-filters">
                        <div class="filter-dropdown">
                            <select id="stageFilter" class="filter-select">
                                <option value="all">Все этапы</option>
                                <option value="Lead">Лид</option>
                                <option value="Commercial Offer">Коммерческое предложение</option>
                                <option value="Negotiation">Переговоры</option>
                                <option value="Signed">Подписание</option>
                            </select>
                        </div>
                    </div>
                </div>
				<table class="clients-table">

                    <thead>
                        <tr>
                            <th>Название</th>
                            <th>ИНН</th>
                            <th>Email</th>
                            <th>Телефон</th>
                            <th>Этап</th>
                            <th>Проекты</th>
                            <th>Действия</th>
                        </tr>

                    </thead>        

					<tbody>

						<tr>

							<td>Acme Corp</th>
							<td>7712345678</th>
							<td>contact@acme.com</th>
							<td>+7 900 000 00 00</th>
							<td>Переговоры</th>
							<td>3</th>

						</tr>

						<tr>

							<td>Tech Ltd</th>
							<td>7722222222</th>
							<td>tech@mail.com</th>
							<td>+7 900 111 11 11</th>
							<td>Активный</th>
							<td>1</th>

						</tr>

					</tbody>

				</table>

			</main>

		</div>

	</div>

	<script src="../../js/layout.js"></script>

    <div class="modal" id="clientModal">

        <div class="modal-content">

            <h2>Создать клиента</h2>

            <div class="form-group">

                <label>
                    Название компании *
                </label>

                <input
                    type="text"
                    id="clientName"
                    placeholder="Название компании"
                >

            </div>

            <div class="form-group">

                <label>
                    ИНН *
                </label>

                <input
                    type="text"
                    id="clientInn"
                    placeholder="10 или 12 цифр"
                >

            </div>

            <div class="form-group">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="clientEmail"
                    placeholder="example@mail.com"
                >

            </div>

            <div class="form-group">

                <label>
                    Телефон
                </label>

                <input
                    type="text"
                    id="clientPhone"
                    placeholder="+7 ..."
                >

            </div>

            <div class="form-group">

                <label>
                    Этап переговоров *
                </label>

                <div class="dropdown" id="stageDropdown">

                    <div class="dropdown-selected">

                        Переговоры

                        <span class="dropdown-arrow">▼</span>

                    </div>

                    <div class="dropdown-menu">

                        <div class="dropdown-item" data-value="Lead">
                            Лид
                        </div>

                        <div class="dropdown-item" data-value="Commercial Offer">
                            Коммерческое предложение
                        </div>

                        <div class="dropdown-item" data-value="Negotiation">
                            Переговоры
                        </div>

                        <div class="dropdown-item" data-value="Signed">
                            Подписание
                        </div>

                    </div>

                </div>


            </div>

            <div
                class="form-error"
                id="clientError"
            ></div>

            <div class="modal-actions">

                <button id="createClientBtn">
                    Создать
                </button>

                <button id="closeClientModal">
                    Отмена
                </button>

            </div>

        </div>

    </div>

    <script src="../../js/layout.js"></script>
    <script src="../../js/clients.js"></script>
</body>

</html>
