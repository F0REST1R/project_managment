<!DOCTYPE html>
<html lang="ru">

<head>
	<script src="https://unpkg.com/lucide@latest"></script>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Проект</title>

	<link rel="stylesheet" href="../../css/dashboard.css">
	<link rel="stylesheet" href="../../css/project.css">

</head>

<body>

	<div class="layout">

		<!-- САЙДБАР (компонент макета) -->

		<div id="sidebar"></div>

		<!-- ОСНОВНАЯ ОБЛАСТЬ -->

		<div class="main">

			<!-- ШАПКА (компонент макета) -->

			<div id="header"></div>

			<!-- РАБОЧАЯ ОБЛАСТЬ -->

			<main class="workspace">

				<div class="project-header">

					<h1>
						CRM Система
					</h1>

					<div class="project-info">

						<span>
							Клиент: Acme Corp
						</span>

						<span>
							Статус: В работе
						</span>

						<span>
							Менеджер: Алексей Лесник
						</span>

					</div>

					<button
						class="create-task"
						id="openTaskModal"
					>
						Создать задачу
					</button>

				</div>

				<!-- ВКЛАДКИ ПРОЕКТА -->

				<div class="project-tabs">

					<button class="tab tab--active">
						Обзор
					</button>

					<button class="tab">
						Задачи
					</button>

					<button class="tab">
						Команда
					</button>

					<button class="tab">
						Бюджет
					</button>

					<button class="tab">
						Документы
					</button>

				</div>

				<!-- СОДЕРЖИМОЕ ПРОЕКТА -->

				<div class="project-content">

					<div class="kanban">

						<!-- КОЛОНКА НОВЫЕ -->

						<div class="kanban-column">

							<h3>
								Новые
							</h3>

							<div
								class="kanban-tasks"
								data-status="new"
							>

								<div
									class="task-card"
									draggable="true"
								>
									Дизайн страницы входа
								</div>

								<div
									class="task-card"
									draggable="true"
								>
									Создать структуру API
								</div>

							</div>

						</div>

						<!-- КОЛОНКА В РАБОТЕ -->

						<div class="kanban-column">

							<h3>
								В работе
							</h3>

							<div
								class="kanban-tasks"
								data-status="progress"
							>

								<div
									class="task-card"
									draggable="true"
								>
									Реализовать базу данных
								</div>

							</div>

						</div>

						<!-- КОЛОНКА ПРОВЕРКА -->

						<div class="kanban-column">

							<h3>
								Проверка
							</h3>

							<div
								class="kanban-tasks"
								data-status="review"
							>

								<div
									class="task-card"
									draggable="true"
								>
									Ревью кода
								</div>

							</div>

						</div>

						<!-- КОЛОНКА ГОТОВО -->

						<div class="kanban-column">

							<h3>
								Готово
							</h3>

							<div
								class="kanban-tasks"
								data-status="done"
							>

								<div
									class="task-card"
									draggable="true"
								>
									Структура проекта
								</div>

							</div>

						</div>

					</div>

				</div>

			</main>

		</div>

	</div>

	<!-- МОДАЛЬНОЕ ОКНО СОЗДАНИЯ ЗАДАЧИ -->

	<div
		class="modal"
		id="taskModal"
	>

		<div class="modal-content">

			<h2>
				Создать задачу
			</h2>

			<input
				type="text"
				id="taskTitle"
				placeholder="Название задачи"
			>

			<select id="taskStatus">

				<option value="new">
					Новая
				</option>

				<option value="progress">
					В работе
				</option>

				<option value="review">
					Проверка
				</option>

				<option value="done">
					Готово
				</option>

			</select>

			<div class="modal-actions">

				<button id="createTaskBtn">
					Создать
				</button>

				<button id="closeTaskModal">
					Отмена
				</button>

			</div>

		</div>

	</div>

	<!-- СКРИПТЫ -->

	<script src="../../js/layout.js"></script>
	<script src="../../js/kanban.js"></script>
	<script src="../../js/tasks.js"></script>

</body>

</html>
