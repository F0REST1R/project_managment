<!DOCTYPE html>
<html lang="ru">

<head>
	<script src="https://unpkg.com/lucide@latest"></script>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<title>Проекты</title>

	<link rel="stylesheet" href="../../css/dashboard.css">
	<link rel="stylesheet" href="../../css/projects.css">

</head>

<body>

	<div class="layout">

		<div id="sidebar"></div>

		<div class="main">

			<div id="header"></div>

			<main class="workspace">

				<div class="projects-header">

					<h1>
						Проекты
					</h1>

					<div class="projects-actions">

						<button id="openProjectModal" class="create-project">
							+ Создать проект
						</button>

						<button id="viewArchive" class="archive-btn">
							Архив
						</button>

					</div>

				</div>


				<table class="projects-table">

					<thead>

						<tr>
							<th>Название</th>
							<th>Клиент</th>
							<th>Менеджер</th>
							<th>Статус</th>
							<th>Начало</th>
							<th>Окончание</th>
						</tr>

					</thead>

					<tbody>

						<tr>
							<td>CRM Система</th>
							<td>Acme Corp</th>
							<td>Алексей Лесник</th>
							<td>В работе</th>
							<td>01.03.2026</th>
							<td>30.05.2026</th>
						</tr>

						<tr>
							<td>Мобильное приложение</th>
							<td>Tech Ltd</th>
							<td>Иван Петров</th>
							<td>Планирование</th>
							<td>10.04.2026</th>
							<td>20.07.2026</th>
						</tr>

					</tbody>

				</table>

			</main>

		</div>

	</div>

<div class="modal" id="projectModal">

	<div class="modal-content">

		<h2>Создать проект</h2>

		<div class="form-group">

			<label>Название проекта *</label>

			<input
				type="text"
				id="projectName"
				placeholder="Название проекта"
			>

		</div>

		<div class="form-group">

			<label>Клиент *</label>

			<div class="client-select">

				<select id="projectClient"></select>

			
			</div>

		</div>

		<div class="form-group">

			<label>Менеджер *</label>

			<select id="projectManager">

				<option value="1">
					Алексей Лесник
				</option>

				<option value="2">
					Иван Петров
				</option>

			</select>

		</div>

		<div class="form-group">

			<label>Дата начала *</label>

			<input
				type="date"
				id="projectStart"
			>

		</div>

		<div class="form-group">

			<label>Дата окончания</label>

			<input
				type="date"
				id="projectEnd"
			>

		</div>

		<div class="form-group">

			<label>Статус</label>

		<div class="dropdown" id="statusDropdown">

			<div class="dropdown-selected">

				Инициация

				<span class="dropdown-arrow">▼</span>

			</div>

			<div class="dropdown-menu">

				<div class="dropdown-item" data-value="initiation">
					Инициация
				</div>

				<div class="dropdown-item" data-value="planning">
					Планирование
				</div>

				<div class="dropdown-item" data-value="active">
					Активный
				</div>

				<div class="dropdown-item" data-value="completed">
					Завершён
				</div>

			</div>

		</div>



		</div>

		<div class="form-error" id="projectError"></div>

		<div class="modal-actions">

			<button id="createProjectBtn">
				Создать проект
			</button>

			<button id="closeProjectModal">
				Отмена
			</button>

		</div>

	</div>

</div>
</div>

<script src="../../js/layout.js"></script>
<script src="../../js/clients.js"></script>
<script src="../../js/projects.js"></script>
</body>

</html>
